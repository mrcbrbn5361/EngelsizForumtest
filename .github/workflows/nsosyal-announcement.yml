name: NSosyal Otomatik Güncelleme Paylaşımı

# Vercel deployment'ı başarıyla tamamlandığında veya manuel olarak tetiklenir
on:
  deployment_status:
  workflow_dispatch:

jobs:
  share-announcement:
    # Sadece Vercel deployment başarılı (success) olduğunda veya manuel tetiklendiğinde çalışır
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Repository Kodunu Çek (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Playwright ve Tarayıcı Bağımlılıklarını Kur
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🚀 NSosyal Üzerinde Güncelleme Gönderisini Paylaş (~500 Karakter)
        env:
          NSOSYAL_EMAIL: ${{ secrets.NSOSYAL_EMAIL }}
          NSOSYAL_PASSWORD: ${{ secrets.NSOSYAL_PASSWORD }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url || 'https://engelsizforum.com' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node scripts/nsosyal-share.js

      - name: 📸 Hata Durumunda Ekran Görüntüsünü Yükle (Debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nsosyal-error-screenshot
          path: artifacts/nsosyal-error.png
          retention-days: 7
