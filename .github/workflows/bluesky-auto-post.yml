name: Post Update to Bluesky

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get latest commit message
        id: commit
        run: |
          DELIMITER="EOF_$(date +%s)"
          echo "commit_msg<<$DELIMITER" >> $GITHUB_ENV
          git log -1 --pretty=%B >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$DELIMITER" >> $GITHUB_ENV

      - name: Post to Bluesky via AT Protocol
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          COMMIT_MESSAGE: ${{ env.commit_msg }}
        run: |
          node -e '
          function parseFacets(text) {
            const facets = [];
            const encoder = new TextEncoder();
            
            // Link matching
            const urlRegex = /https?:\/\/[^\s]+/g;
            let match;
            while ((match = urlRegex.exec(text)) !== null) {
              const url = match[0];
              const byteStart = encoder.encode(text.substring(0, match.index)).byteLength;
              const byteEnd = byteStart + encoder.encode(url).byteLength;
              facets.push({
                index: { byteStart, byteEnd },
                features: [{ "$type": "app.bsky.richtext.facet#link", uri: url }]
              });
            }

            // Hashtag matching
            const tagRegex = /#([\wğüşıöçĞÜŞİÖÇ]+)/g;
            while ((match = tagRegex.exec(text)) !== null) {
              const tag = match[1];
              const fullTag = match[0];
              const byteStart = encoder.encode(text.substring(0, match.index)).byteLength;
              const byteEnd = byteStart + encoder.encode(fullTag).byteLength;
              facets.push({
                index: { byteStart, byteEnd },
                features: [{ "$type": "app.bsky.richtext.facet#tag", tag: tag }]
              });
            }

            return facets;
          }

          async function postToBluesky() {
            const handle = process.env.BSKY_HANDLE || "miracbirben.bsky.social";
            const password = process.env.BSKY_PASSWORD;
            
            if (!password) {
              console.error("❌ HATA: GitHub Secrets içinde 'BSKY_PASSWORD' tanımlı değil!");
              console.error("Lütfen GitHub Deponuz -> Settings -> Secrets and variables -> Actions sayfasından BSKY_PASSWORD ekleyin.");
              process.exit(1);
            }

            // Format date and time (TR / Europe/Istanbul)
            const now = new Date();
            const dateStr = now.toLocaleDateString("tr-TR", { timeZone: "Europe/Istanbul", day: "2-digit", month: "2-digit", year: "numeric" });
            const timeStr = now.toLocaleTimeString("tr-TR", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit" });
            const dateTime = `${dateStr} ${timeStr}`;

            let cleanCommit = (process.env.COMMIT_MESSAGE || "Platform güncellemeleri ve erişilebilirlik iyileştirmeleri yayınlandı.").trim();
            // Remove code blocks and SQL statements if present
            cleanCommit = cleanCommit.replace(/```[\s\S]*?```/g, "").replace(/ALTER TABLE[\s\S]*/gi, "Veritabanı esnekliği ve kategori yönetimi güçlendirildi.").trim();

            let text = `🚀 EngelsizForum Güncellendi!\n📅 ${dateTime}\n\n📝 ${cleanCommit}\n\n🌐 https://engelsizforum.com\n\n#EngelsizForum #A11y #WebDev`;

            if (text.length > 295) {
              const extraChars = text.length - 292;
              const maxCommitLen = Math.max(30, cleanCommit.length - extraChars);
              cleanCommit = cleanCommit.substring(0, maxCommitLen) + "...";
              text = `🚀 EngelsizForum Güncellendi!\n📅 ${dateTime}\n\n📝 ${cleanCommit}\n\n🌐 https://engelsizforum.com\n\n#EngelsizForum #A11y #WebDev`;
            }

            const facets = parseFacets(text);

            console.log("Authenticating with Bluesky as:", handle);

            try {
              const sessionRes = await fetch("https://bsky.social/xrpc/com.atproto.server.createSession", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ identifier: handle, password: password })
              });

              if (!sessionRes.ok) {
                const errText = await sessionRes.text();
                console.error("❌ Bluesky Giriş Hatası:", errText);
                process.exit(1);
              }

              const session = await sessionRes.json();
              console.log("✅ Bluesky Oturumu Açıldı. DID:", session.did);

              const postRes = await fetch("https://bsky.social/xrpc/com.atproto.repo.createRecord", {
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + session.accessJwt,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  repo: session.did,
                  collection: "app.bsky.feed.post",
                  record: {
                    text: text,
                    facets: facets,
                    createdAt: new Date().toISOString()
                  }
                })
              });

              if (!postRes.ok) {
                const postErr = await postRes.text();
                console.error("❌ Bluesky Gönderi Paylaşma Hatası:", postErr);
                process.exit(1);
              }

              const postData = await postRes.json();
              console.log("🎉 TEBRİKLER! Bluesky Gönderisi Başarıyla Paylaşıldı!");
              console.log("Gönderi URI:", postData.uri);
            } catch (err) {
              console.error("❌ Beklenmeyen Hata:", err);
              process.exit(1);
            }
          }
          
          postToBluesky();
          '

