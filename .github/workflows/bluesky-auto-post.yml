name: Post Update to Bluesky

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get latest commit message
        id: commit
        run: |
          DELIMITER="EOF_$(date +%s)"
          echo "commit_msg<<$DELIMITER" >> $GITHUB_ENV
          git log -1 --pretty=%B >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$DELIMITER" >> $GITHUB_ENV

      - name: Post to Bluesky via AT Protocol
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          COMMIT_MESSAGE: ${{ env.commit_msg }}
        run: |
          node -e '
          const https = require("https");
          
          function parseFacets(text) {
            const facets = [];
            const encoder = new TextEncoder();
            
            // Link matching
            const urlRegex = /https?:\/\/[^\s]+/g;
            let match;
            while ((match = urlRegex.exec(text)) !== null) {
              const url = match[0];
              const byteStart = encoder.encode(text.substring(0, match.index)).byteLength;
              const byteEnd = byteStart + encoder.encode(url).byteLength;
              facets.push({
                index: { byteStart, byteEnd },
                features: [{ "$type": "app.bsky.richtext.facet#link", uri: url }]
              });
            }

            // Hashtag matching
            const tagRegex = /#([\wğüşıöçĞÜŞİÖÇ]+)/g;
            while ((match = tagRegex.exec(text)) !== null) {
              const tag = match[1];
              const fullTag = match[0];
              const byteStart = encoder.encode(text.substring(0, match.index)).byteLength;
              const byteEnd = byteStart + encoder.encode(fullTag).byteLength;
              facets.push({
                index: { byteStart, byteEnd },
                features: [{ "$type": "app.bsky.richtext.facet#tag", tag: tag }]
              });
            }

            return facets;
          }

          async function postToBluesky() {
            const handle = process.env.BSKY_HANDLE || "miracbirben.bsky.social";
            const password = process.env.BSKY_PASSWORD;
            
            if (!password) {
              console.log("BSKY_PASSWORD secret not found. Skipping auto-post.");
              return;
            }

            // Format date and time (TR / Europe/Istanbul)
            const now = new Date();
            const dateStr = now.toLocaleDateString("tr-TR", { timeZone: "Europe/Istanbul", day: "2-digit", month: "2-digit", year: "numeric" });
            const timeStr = now.toLocaleTimeString("tr-TR", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit" });
            const dateTime = `${dateStr} ${timeStr}`;

            let rawCommit = (process.env.COMMIT_MESSAGE || "Kategori yapısı ve otomatik paylaşım entegrasyonu güncellendi.").trim();
            // Remove code blocks and SQL statements if present
            rawCommit = rawCommit.replace(/```[\s\S]*?```/g, "").replace(/ALTER TABLE[\s\S]*/gi, "Veritabanı esnekliği ve kategori yönetimi güçlendirildi.").trim();

            let text = `🚀 EngelsizForum Güncellendi! / Updated!\n📅 ${dateTime}\n\n🇹🇷 ${rawCommit}\n🇬🇧 New platform updates & accessibility improvements deployed!\n\n🌐 https://engelsizforum.com\n\n#EngelsizForum #WebDev #A11y`;

            if (text.length > 290) {
              const truncatedCommit = rawCommit.substring(0, 75) + "...";
              text = `🚀 EngelsizForum Güncellendi! / Updated!\n📅 ${dateTime}\n\n🇹🇷 ${truncatedCommit}\n🇬🇧 New updates live!\n\n🌐 https://engelsizforum.com\n\n#EngelsizForum #WebDev #A11y`;
            }

            const facets = parseFacets(text);

            console.log("Authenticating with Bluesky as:", handle);
            
            const sessionData = JSON.stringify({ identifier: handle, password: password });
            
            const reqSession = https.request({
              hostname: "bsky.social",
              path: "/xrpc/com.atproto.server.createSession",
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(sessionData)
              }
            }, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", async () => {
                if (res.statusCode !== 200) {
                  console.error("Auth failed:", data);
                  process.exit(1);
                }
                const session = JSON.parse(data);
                const accessJwt = session.accessJwt;
                const repo = session.did;

                const postRecord = {
                  repo: repo,
                  collection: "app.bsky.feed.post",
                  record: {
                    text: text,
                    facets: facets,
                    createdAt: new Date().toISOString()
                  }
                };

                const postData = JSON.stringify(postRecord);
                const reqPost = https.request({
                  hostname: "bsky.social",
                  path: "/xrpc/com.atproto.repo.createRecord",
                  method: "POST",
                  headers: {
                    "Authorization": "Bearer " + accessJwt,
                    "Content-Type": "application/json",
                    "Content-Length": Buffer.byteLength(postData)
                  }
                }, (resPost) => {
                  let postResData = "";
                  resPost.on("data", chunk => postResData += chunk);
                  resPost.on("end", () => {
                    if (resPost.statusCode === 200) {
                      console.log("Successfully posted to Bluesky!");
                    } else {
                      console.error("Failed to post:", postResData);
                      process.exit(1);
                    }
                  });
                });
                reqPost.on("error", e => { console.error(e); process.exit(1); });
                reqPost.write(postData);
                reqPost.end();
              });
            });
            reqSession.on("error", e => { console.error(e); process.exit(1); });
            reqSession.write(sessionData);
            reqSession.end();
          }
          
          postToBluesky();
          '

