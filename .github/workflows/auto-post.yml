name: EngelsizForum Otonom Sosyal Medya Paylaşımı (Make.com)

on:
  push:
    branches:
      - main
      - master

jobs:
  auto-post:
    name: Otonom AI Analiz ve Sosyal Medya Paylaşımı
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repositoriyi Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Gemini AI İle Metin Üretimi ve Sosyal Medya Paylaşımı (Make.com LinkedIn & NSosyal)
        env:
          TZ: 'Europe/Istanbul'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          NSOSYAL_API_URL: ${{ secrets.NSOSYAL_API_URL }}
          NSOSYAL_BEARER_TOKEN: ${{ secrets.NSOSYAL_BEARER_TOKEN }}
        run: |
          echo "=== Gemini AI Analizi ve Metin Üretimi Başlatılıyor (Türkiye Saati: $(date '+%d.%m.%Y %H:%M:%S %Z')) ==="
          node scripts/auto-social-poster.js
