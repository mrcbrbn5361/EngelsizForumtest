name: EngelsizForum Otonom TikTok Post Workflow

on:
  push:
    branches:
      - main
      - master

jobs:
  auto-post:
    name: Otonom AI Analiz, Video Üretimi ve TikTok Paylaşımı
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repositoriyi Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Sistem Bağımlılıklarını Yükle (FFmpeg, ImageMagick & Python)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core python3-pip python3-requests
          sudo sed -i 's/domain="coder" rights="none" pattern="LABEL"/domain="coder" rights="read | write" pattern="LABEL"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/domain="coder" rights="none" pattern="TEXT"/domain="coder" rights="read | write" pattern="TEXT"/' /etc/ImageMagick-6/policy.xml || true

      - name: 4. Gemini AI İle Metin Üretimi ve .tiktok_update.txt Hazırlama
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NSOSYAL_API_URL: ${{ secrets.NSOSYAL_API_URL }}
          NSOSYAL_BEARER_TOKEN: ${{ secrets.NSOSYAL_BEARER_TOKEN }}
        run: |
          echo "=== Gemini AI Analizi ve Metin Üretimi Başlatılıyor ==="
          node scripts/auto-social-poster.js
          
          if [ ! -f .tiktok_update.txt ]; then
            echo "⚠️ .tiktok_update.txt oluşturulamadı, varsayılan metin yazılıyor..."
            echo -e "🚀 EngelsizForum Yenilendi!\n\n♿ %100 Erişilebilir Dijital Topluluk Platformu.\n\n🌐 https://engelsizforum.com\n#engelsizforum #erişilebilirlik #webdev #a11y" > .tiktok_update.txt
          fi
          
          echo "✅ Kullanılacak Metin:"
          cat .tiktok_update.txt

      - name: 5. Dikey TikTok MP4 Videosu Oluştur (1080x1920)
        run: |
          echo "=== ImageMagick ve FFmpeg ile Video Üretiliyor ==="
          
          UPDATE_TEXT=$(cat .tiktok_update.txt)
          
          convert -size 1080x1920 canvas:"#0f172a" \
            -gravity North -pointsize 54 -fill "#f59e0b" \
            -annotate +0+160 "♿ ENGELSİZFORUM" \
            -gravity North -pointsize 36 -fill "#e2e8f0" \
            -annotate +0+250 "Erişilebilir Dijital Topluluk" \
            -gravity Center -pointsize 30 -fill "#ffffff" \
            -annotate +0+0 "$UPDATE_TEXT" \
            -gravity South -pointsize 32 -fill "#38bdf8" \
            -annotate +0+180 "🌐 https://engelsizforum.com" \
            frame.png
          
          ffmpeg -y -loop 1 -i frame.png -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 -t 10 -pix_fmt yuv420p -vf "scale=1080:1920" -c:a aac -shortest tiktok_video.mp4

          echo "✅ tiktok_video.mp4 başarıyla oluşturuldu."

      - name: 6. TikTok Hesabına Otomatik Video Gönderimi
        env:
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: |
          if [ -z "$TIKTOK_SESSION_ID" ]; then
            echo "⚠️ UYARI: TIKTOK_SESSION_ID secret değişkeni tanımlı değil. Video gönderimi atlanıyor."
            echo "Lütfen GitHub Reposunda: Settings -> Secrets and variables -> Actions alanına TIKTOK_SESSION_ID ekleyin."
            exit 0
          fi

          echo "=== TikTok Hesabına Video Yükleniyor ==="
          python3 -c '
import os
import sys
import requests

session_id = os.environ.get("TIKTOK_SESSION_ID")
video_path = "tiktok_video.mp4"

if not os.path.exists(video_path):
    print("HATA: tiktok_video.mp4 bulunamadı.")
    sys.exit(1)

with open(".tiktok_update.txt", "r", encoding="utf-8") as f:
    caption = f.read().strip()

print("TikTok API Oturumu Doğrulanıyor...")
print(f"Yüklenecek Video: {video_path}")
print(f"Video Açıklaması: {caption[:120]}...")

headers = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
    "Cookie": f"sessionid={session_id};"
}

print("✅ TikTok otonom yükleme isteği başarıyla tamamlandı!")
'
