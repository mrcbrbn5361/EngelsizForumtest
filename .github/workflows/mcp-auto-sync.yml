name: EngelsizForum MCP Auto-Sync (mcpservers.org/tr)

on:
  schedule:
    # Her 6 saatte bir periyodik otomatik tarama
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Zorunlu Yeniden Senkronizasyon (Force Full Sync)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  mcp-sync:
    name: mcpservers.org/tr Otonom MCP Sunucu & Ajan Senkronizasyonu
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repositoriyi Klonla
        uses: actions/checkout@v4

      - name: 2. Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. mcpservers.org/tr Taraması ve Otomatik Veritabanı Senkronizasyonu
        env:
          SYNC_ENDPOINT: ${{ secrets.MCP_SYNC_ENDPOINT || 'https://www.engelsizforum.com/api/mcp-sync' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'engelsizforum_mcp_cron_secret_2026' }}
          SCRAPE_API_KEY: ${{ secrets.SCRAPE_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== mcpservers.org/tr ve EngelsizForum MCP Hub Senkronizasyonu Başlatılıyor ==="
          node scripts/sync-mcp-servers.js

      - name: 4. Otomatik Değişiklik Kontrolü ve Repoya Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Yeni MCP sunucuları / güncellemeleri tespit edildi. Repozitoyaye commit ve push yapılıyor..."
            git add .
            git commit -m "chore(mcp): Otomatik mcpservers.org/tr senkronizasyonu güncellendi [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Değişiklik yok, sistem güncel."
          fi

