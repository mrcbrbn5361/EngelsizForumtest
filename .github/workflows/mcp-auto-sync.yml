name: MCP Auto-Sync Worker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_mcpservers:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Klonla
        uses: actions/checkout@v4

      - name: 2. Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Gerekli Kütüphaneleri Yükle
        run: pip install requests beautifulsoup4

      - name: 4. MCP Senkronizasyon Betiğini Çalıştır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync-mcpservers.py

      - name: 5. Değişiklikleri Otomatik Commit Et ve Pushla
        run: git config --global user.name 'MCP Auto-Sync Bot' && git config --global user.email 'bot@engelsizforum.com' && git add . && (git diff --staged --quiet || (git commit -m '🤖 Otomatik MCP Güncellemesi: mcpservers.org/tr senkronize edildi' && git push))
